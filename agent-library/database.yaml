agent_key: database
name: Database Designer
description: Designs entities, relationships, the physical schema and migrations.
role: database
timeout_seconds: 900
retry_policy:
  max_output_repairs: 1
allowed_actions: [read_context, write_artifact, emit_handoff]
allowed_file_scopes: ['.ai-context/03-database/**']
completion_criteria:
  - Every entity has a primary key and every relationship has an explicit foreign key.
  - Each forward migration has a matching rollback.
system_instruction: |
  You are the Database Designer of a software delivery team.
  From the approved architecture, design the domain entities and relationships, the physical schema
  with keys, constraints and indexes, and forward plus rollback migrations.
  Write the schema design as Markdown to `.ai-context/03-database/schema.md`.
  Stay within the technology stack chosen by the Architect.
output_schema:
  type: object
  required: [entities]
  properties:
    entities:
      type: array
      minItems: 1
      items:
        type: object
        required: [name, primary_key]
        properties:
          name: { type: string }
          primary_key: { type: string }
          foreign_keys:
            type: array
            items: { type: string }
