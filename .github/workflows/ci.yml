name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run depcheck
      - run: npm test # includes web component tests (apps/web/test, jsdom)
      - run: npm run build:web

  # Browser smoke test: builds the UI, starts a throwaway API and drives headless Chrome through
  # every main screen (scripts/ui-smoke-ci.mjs → scripts/ui-smoke.mjs). Fails on any failed step or JS error.
  ui-smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Git identity for project repositories created by the smoke test
        run: |
          git config --global user.name "CI smoke"
          git config --global user.email "ci-smoke@example.invalid"
      - name: Show browser
        run: google-chrome --version
      - run: npm run smoke:ui
        env:
          EDGE_PATH: /usr/bin/google-chrome
